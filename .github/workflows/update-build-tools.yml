name: Update the Node.js and pnpm versions

# Dependabot cannot see the Node.js and pnpm versions the frontend-maven-plugin installs: they are
# plain text in the root pom, not Maven artifacts. This proposes the newest release of each pinned
# major version the way Dependabot would; moving to a new major remains a manual decision.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    strategy:
      # Each tool is proposed on its own, so one failing lookup does not hold back the other.
      fail-fast: false
      matrix:
        tool: [node, pnpm]
    runs-on: ubuntu-latest
    defaults:
      run:
        # Unlike the implicit default, an explicit bash also fails a step when a download in the
        # middle of a pipe does, rather than carrying an empty version forward.
        shell: bash
    env:
      # GitHub holds the checks of a pull request the default token opens until someone approves
      # them; a token from this secret, if set, opens it as its owner instead.
      GH_TOKEN: ${{ secrets.DEPS_UPDATE_TOKEN || github.token }}
      # A release must be this many days old before it is proposed, so one withdrawn soon after
      # publishing never reaches a pull request.
      COOLDOWN_DAYS: 3
    steps:
      - name: Code Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ env.GH_TOKEN }}
      - name: Find The Newest Node.js Release Of The Pinned Major Version
        if: matrix.tool == 'node'
        # Security releases are exempt from the cooldown. The release index lists the newest first.
        run: |
          CURRENT=$(sed -n 's|.*<nodeVersion>v\(.*\)</nodeVersion>.*|\1|p' pom.xml)
          LATEST=$(curl -fsSL https://nodejs.org/dist/index.json \
            | jq -r --arg major "v${CURRENT%%.*}." --arg cutoff "$(date -u -d "$COOLDOWN_DAYS days ago" +%F)" \
              'first(.[] | select((.version | startswith($major)) and (.security or .date <= $cutoff))) | .version | ltrimstr("v")')
          echo "current=$CURRENT" >> "$GITHUB_ENV"
          echo "latest=$LATEST" >> "$GITHUB_ENV"
          echo "release_notes=https://github.com/nodejs/node/releases/tag/v$LATEST" >> "$GITHUB_ENV"
      - name: Find The Newest pnpm Release Of The Pinned Major Version
        if: matrix.tool == 'pnpm'
        # The registry has no security flag, so no release skips the cooldown; deprecated and
        # pre-release versions are never proposed. It records the instant of publishing, so the cutoff
        # is an instant too, where the Node.js index only has the day.
        run: |
          CURRENT=$(sed -n 's|.*<pnpmVersion>\(.*\)</pnpmVersion>.*|\1|p' pom.xml)
          LATEST=$(curl -fsSL https://registry.npmjs.org/pnpm \
            | jq -r --arg major "^${CURRENT%%.*}\\.[0-9]+\\.[0-9]+$" --arg cutoff "$(date -u -d "$COOLDOWN_DAYS days ago" +%FT%TZ)" \
              '.time as $published
               | [.versions[] | select((.version | test($major)) and .deprecated == null and $published[.version] <= $cutoff) | .version]
               | max_by(split(".") | map(tonumber)) // empty')
          echo "current=$CURRENT" >> "$GITHUB_ENV"
          echo "latest=$LATEST" >> "$GITHUB_ENV"
          echo "release_notes=https://github.com/pnpm/pnpm/releases/tag/v$LATEST" >> "$GITHUB_ENV"
      - name: Compare With The Pinned Version
        # Only a strictly newer release is proposed: a pin moved by hand past what the cooldown
        # admits must not be proposed back down, and a lookup that found nothing proposes nothing.
        run: |
          echo "Pinned: $current, newest eligible: ${latest:-none}"
          NEWEST=$(printf '%s\n' "$current" "$latest" | sort -V | tail -n 1)
          if [ -n "$latest" ] && [ "$latest" != "$current" ] && [ "$NEWEST" = "$latest" ]; then
            echo "newer=true" >> "$GITHUB_ENV"
          fi
      - name: Update Node.js
        if: matrix.tool == 'node' && env.newer == 'true'
        run: sed -i "s|<nodeVersion>v$current</nodeVersion>|<nodeVersion>v$latest</nodeVersion>|" pom.xml
      - name: Update pnpm
        if: matrix.tool == 'pnpm' && env.newer == 'true'
        # Both package.json files name the same pnpm, which pnpm-workspace.yaml makes binding, so
        # they move together with the pom.
        run: |
          sed -i "s|<pnpmVersion>$current</pnpmVersion>|<pnpmVersion>$latest</pnpmVersion>|" pom.xml
          sed -i "s|\"packageManager\": \"pnpm@$current\"|\"packageManager\": \"pnpm@$latest\"|" \
            aggregated-frontend/src/main/frontend/package.json integration-tests/src/test/e2e/package.json
      - name: Propose The Update
        if: env.newer == 'true'
        # A release already proposed is not proposed again, whether its pull request is still open or
        # was declined. A branch left without one by an earlier failed run is simply replaced.
        run: |
          BRANCH="deps-update-${{ matrix.tool }}-$latest"
          if [ -n "$(gh pr list --head "$BRANCH" --state all --json number --jq '.[].number')" ]; then
            echo "Already proposed on $BRANCH"
            exit 0
          fi
          TITLE="[deps] Update the ${{ matrix.tool }} version to $latest"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git commit -am "$TITLE"
          git push --force origin "$BRANCH"
          gh pr create --base "${{ github.ref_name }}" --head "$BRANCH" --title "$TITLE" \
            --body "[$latest]($release_notes) is the newest release of the major version the frontend build pins."
