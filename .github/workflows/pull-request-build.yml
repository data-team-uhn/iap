name: Pull Request Build

on:
  pull_request:
    types: [opened, synchronize, reopened]
  # Also verify the actual merge results: two individually green PRs can still
  # conflict semantically once combined on the main branch
  push:
    branches: [main]

# The build only reads the repository; nothing here writes back to GitHub. Stating that keeps the
# token read-only whatever the organization-wide default is, including on the push builds, which
# unlike pull requests from forks are not restricted automatically.
permissions:
  contents: read

# Newer commits on the same PR supersede the running build; main builds are never cancelled
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    # The integration tests boot two full Sling instances and drive them through a browser, which is
    # minutes of wall clock on top of the ordinary build
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Nothing after this step talks to git, so the credential has no reason to stay in
          # .git/config, where the Maven and pnpm downloads that follow could read it.
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Cache pnpm store
        uses: actions/cache@v6
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ hashFiles('aggregated-frontend/src/main/frontend/pnpm-lock.yaml') }}
          restore-keys: pnpm-

      # Chromium is ~150MB and the version is pinned by the e2e package.json, so it only has to be
      # fetched again when that file changes. The system libraries it needs are installed by the build
      # itself (see -Dplaywright.install.deps below) and are not part of this cache.
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('integration-tests/src/test/e2e/package.json') }}
          restore-keys: playwright-

      # The integration tests run in the same job, and the same reactor, as the rest of the build: they
      # launch the feature the packaging modules have just installed into the local repository, so a
      # separate job would have to rebuild it or carry it across.
      #
      # Production mode for the frontend, so that minification/tree-shaking
      # breakages surface here instead of at deployment time
      - name: Full build
        run: >
          mvn -B -ntp clean install javadoc:javadoc
          -Ptests -PintegrationTests
          -DwebpackArguments=--mode=production
          -Dplaywright.install.deps=--with-deps

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: '**/target/surefire-reports/'
          if-no-files-found: ignore

      # A browser test that fails only on CI is close to undiagnosable from the log alone. Playwright
      # keeps a trace, a screenshot and a video for exactly those runs; without this step they are
      # discarded with the runner.
      - name: Upload end-to-end test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report
          path: |
            integration-tests/target/e2e-report/
            integration-tests/target/e2e-results/
          if-no-files-found: ignore
