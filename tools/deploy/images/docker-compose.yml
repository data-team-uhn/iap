#
# THIS FILE IS NOT RUN. It is where the companion images ../generate_compose.py deploys are
# pinned, and it is a Compose file purely so that Dependabot can see them: Dependabot reads
# image versions out of Dockerfiles and Compose files, and would never find them in a Python
# constant. It watches this directory (see .github/dependabot.yml) and opens a pull request
# here when one of these images has a newer tag.
#
# generate_compose.py reads the versions back out of this file, so a Dependabot pull request
# changes what actually gets deployed. Keep the two in step: a service named here that the
# generator does not know is ignored, but one the generator wants and cannot find is an error.
#
# `mail` is the odd one out -- it is built from ../mailcatcher/Dockerfile rather than pulled, so
# its base image is pinned in that Dockerfile and Dependabot watches it as a Dockerfile instead.
#
# The IAP image itself is deliberately absent: it is built from this repository, not pulled, and
# which one to run is the caller's business (generate_compose.py --image).

services:
  postgres:
    image: "postgres:18-alpine"

  mongo:
    image: "mongo:8"

  keycloak:
    image: "quay.io/keycloak/keycloak:26.7.3-0"
