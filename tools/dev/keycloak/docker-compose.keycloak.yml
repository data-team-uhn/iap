#
# Local-dev Keycloak for IAP's OIDC sign-in, on the shared `iap` Docker network and
# published to the host on 127.0.0.1:8084. KC_HOSTNAME pins the issuer/front-channel URL
# to http://localhost:8084 while KC_HOSTNAME_BACKCHANNEL_DYNAMIC lets IAP reach the token
# endpoint in-network at http://keycloak:8080 (see docs/keycloak-oidc.md).
#
# Usage:
#   docker network create iap                                   # once, if it doesn't exist
#   docker compose -f docker-compose.keycloak.yml up -d         # (the `docker run -d` equivalent)
#   ./keycloak_setup.sh                                         # then configure realm/client/roles

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.0
    container_name: keycloak
    command: start-dev
    networks: [iap]
    ports:
      - "127.0.0.1:8084:8080"
    environment:
      KC_HOSTNAME: http://localhost:8084
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin

networks:
  iap:
    external: true
    name: iap
