#
# Local-dev IAP container on the shared `iap` Docker network. It reaches Keycloak in-network
# for the back-channel (BACKEND_KEYCLOAK_REALM_URL=http://keycloak:8080/realms/iap) while the
# browser uses the front-channel (FRONTEND_KEYCLOAK_REALM_URL=http://localhost:8084/realms/iap).
# Bring Keycloak up first (docker-compose.keycloak.yml).
#
# Usage:
#   docker compose -f docker-compose.iap.yml up          # foreground, like `docker run -it`; Ctrl+C stops
#   docker compose -f docker-compose.iap.yml down        # remove the container (the `--rm` equivalent)
#
# `up` honours `container_name: iap`, so `docker run --network container:iap ...` sidecars still work.
# `docker compose -f docker-compose.iap.yml run --rm --service-ports iap` is a closer match to
# `docker run --rm -it -p ...`, but uses a generated container name rather than `iap`.

services:
  iap:
    image: iap/iap
    container_name: iap
    networks: [iap]
    volumes:
      - ${HOME}/.m2:/root/.m2
    ports:
      - "8080:8080"
    stdin_open: true          # -i
    tty: true                 # -t
    environment:
      OAK_FILESYSTEM: "true"
      KEYCLOAK_ENABLED: "true"
      BACKEND_KEYCLOAK_REALM_URL: ${BACKEND_KEYCLOAK_REALM_URL}
      FRONTEND_KEYCLOAK_REALM_URL: ${FRONTEND_KEYCLOAK_REALM_URL}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-iap-sling}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
      IAP_PUBLIC_URL: ${IAP_PUBLIC_URL:-http://localhost:8080}
      IAP_OAUTH_ENCRYPTION_PASSWORD: ${IAP_OAUTH_ENCRYPTION_PASSWORD:-devpassword}

networks:
  iap:
    external: true
    name: iap
