<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img">
  <style>
    .lbl { font: 13px -apple-system, "Segoe UI", Roboto, sans-serif; fill: #202124; }
    .lbl-sm { font: 11px -apple-system, "Segoe UI", Roboto, sans-serif; fill: #3c4043; }
    .lbl-b { font: 600 13px -apple-system, "Segoe UI", Roboto, sans-serif; fill: #202124; }
    .cap { font: italic 12px -apple-system, "Segoe UI", Roboto, sans-serif; fill: #5f6368; }
    .task { fill: #e8f0fe; stroke: #1a73e8; stroke-width: 2; }
    .svc  { fill: #e6f4ea; stroke: #188038; stroke-width: 2; }
    .gw   { fill: #fef7e0; stroke: #ea8600; stroke-width: 2; }
    .ev-s { fill: #e6f4ea; stroke: #188038; stroke-width: 2; }
    .ev-e { fill: #fce8e6; stroke: #c5221f; stroke-width: 3; }
    .ev-i { fill: #fef7e0; stroke: #ea8600; stroke-width: 2; }
    .flow { stroke: #5f6368; stroke-width: 1.6; fill: none; marker-end: url(#a); }
    .tok  { fill: #d93025; stroke: #fff; stroke-width: 2; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5f6368"/>
    </marker>
  </defs>

  <circle cx="42" cy="80" r="20" class="ev-s"/>
  <text x="42" y="122" class="lbl-sm" text-anchor="middle">Request filed</text>
  <line x1="64" y1="80" x2="116" y2="80" class="flow"/>

  <rect x="118" y="54" width="132" height="52" rx="10" class="task"/>
  <text x="184" y="78" class="lbl" text-anchor="middle">Manager</text>
  <text x="184" y="94" class="lbl" text-anchor="middle">decides</text>
  <text x="184" y="132" class="lbl-sm" text-anchor="middle">performers:</text>
  <text x="184" y="148" class="lbl-sm" text-anchor="middle">managers</text>

  <circle cx="230" cy="106" r="14" class="ev-i" stroke-dasharray="4 3"/>
  <circle cx="230" cy="106" r="10" fill="none" stroke="#ea8600" stroke-width="1.5" stroke-dasharray="4 3"/>
  <path d="M 230 100 L 230 106 L 234 109" stroke="#ea8600" stroke-width="1.5" fill="none"/>
  <path d="M 230 120 L 230 196 L 300 196" class="flow"/>
  <text x="236" y="190" class="lbl-sm">after 5 days</text>
  <rect x="302" y="170" width="130" height="50" rx="10" class="svc"/>
  <text x="367" y="192" class="lbl" text-anchor="middle">Remind the</text>
  <text x="367" y="208" class="lbl" text-anchor="middle">manager</text>
  <line x1="434" y1="195" x2="470" y2="195" class="flow"/>
  <circle cx="492" cy="195" r="18" class="ev-e"/>
  <text x="530" y="180" class="lbl-sm">the dashed timer does not</text>
  <text x="530" y="196" class="lbl-sm">interrupt: the manager still</text>
  <text x="530" y="212" class="lbl-sm">has to decide</text>

  <line x1="252" y1="80" x2="312" y2="80" class="flow"/>
  <path d="M 316 80 L 348 48 L 380 80 L 348 112 Z" class="gw"/>
  <text x="348" y="86" class="lbl-b" text-anchor="middle">×</text>
  <text x="348" y="140" class="lbl-sm" text-anchor="middle">Approved?</text>

  <path d="M 380 80 L 430 80 L 430 36 L 492 36" class="flow"/>
  <text x="434" y="28" class="lbl-sm">approved</text>
  <path d="M 380 80 L 410 80 L 410 118 L 492 118" class="flow"/>
  <text x="414" y="136" class="lbl-sm">rejected</text>

  <rect x="494" y="10" width="140" height="52" rx="10" class="svc"/>
  <text x="564" y="34" class="lbl" text-anchor="middle">Book the days</text>
  <text x="564" y="50" class="lbl" text-anchor="middle">off</text>
  <line x1="636" y1="36" x2="690" y2="36" class="flow"/>

  <rect x="494" y="92" width="140" height="52" rx="10" class="svc"/>
  <text x="564" y="116" class="lbl" text-anchor="middle">Tell the</text>
  <text x="564" y="132" class="lbl" text-anchor="middle">requester why</text>
  <line x1="636" y1="118" x2="690" y2="118" class="flow"/>

  <circle cx="712" cy="36" r="20" class="ev-e"/>
  <text x="712" y="78" class="lbl-sm" text-anchor="middle">Approved</text>
  <circle cx="712" cy="118" r="20" class="ev-e"/>
  <text x="712" y="160" class="lbl-sm" text-anchor="middle">Rejected</text>

  <text x="790" y="30" class="lbl-b">Blue</text>
  <text x="790" y="48" class="cap">a person</text>
  <text x="790" y="64" class="cap">does it</text>
  <text x="790" y="96" class="lbl-b">Green</text>
  <text x="790" y="114" class="cap">the system</text>
  <text x="790" y="130" class="cap">does it</text>

</svg>
