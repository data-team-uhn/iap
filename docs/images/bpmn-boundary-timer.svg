<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 210" width="700" height="210" role="img">
  <style>
    .lbl { font: 13px -apple-system, "Segoe UI", Roboto, sans-serif; fill: #202124; }
    .lbl-sm { font: 11px -apple-system, "Segoe UI", Roboto, sans-serif; fill: #3c4043; }
    .lbl-b { font: 600 13px -apple-system, "Segoe UI", Roboto, sans-serif; fill: #202124; }
    .cap { font: italic 12px -apple-system, "Segoe UI", Roboto, sans-serif; fill: #5f6368; }
    .task { fill: #e8f0fe; stroke: #1a73e8; stroke-width: 2; }
    .svc  { fill: #e6f4ea; stroke: #188038; stroke-width: 2; }
    .gw   { fill: #fef7e0; stroke: #ea8600; stroke-width: 2; }
    .ev-s { fill: #e6f4ea; stroke: #188038; stroke-width: 2; }
    .ev-e { fill: #fce8e6; stroke: #c5221f; stroke-width: 3; }
    .ev-i { fill: #fef7e0; stroke: #ea8600; stroke-width: 2; }
    .flow { stroke: #5f6368; stroke-width: 1.6; fill: none; marker-end: url(#a); }
    .tok  { fill: #d93025; stroke: #fff; stroke-width: 2; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5f6368"/>
    </marker>
  </defs>

  <line x1="20" y1="70" x2="72" y2="70" class="flow"/>
  <rect x="74" y="42" width="150" height="56" rx="10" class="task"/>
  <text x="149" y="68" class="lbl" text-anchor="middle">Manager</text>
  <text x="149" y="84" class="lbl" text-anchor="middle">reviews request</text>
  <circle cx="204" cy="98" r="15" class="ev-i"/>
  <circle cx="204" cy="98" r="11" fill="none" stroke="#ea8600" stroke-width="1.6"/>
  <path d="M 204 92 L 204 98 L 208 101" stroke="#ea8600" stroke-width="1.6" fill="none"/>
  <line x1="226" y1="70" x2="286" y2="70" class="flow"/>
  <circle cx="308" cy="70" r="19" class="ev-e"/>

  <path d="M 204 113 L 204 152 L 286 152" class="flow"/>
  <text x="214" y="146" class="lbl-sm">after 5 days</text>
  <rect x="288" y="126" width="150" height="52" rx="10" class="svc"/>
  <text x="363" y="148" class="lbl" text-anchor="middle">Remind the</text>
  <text x="363" y="164" class="lbl" text-anchor="middle">manager</text>

  <text x="480" y="60" class="lbl-b">A timer on the edge of a task</text>
  <text x="480" y="84" class="cap">watches while the task is open.</text>
  <text x="480" y="104" class="cap">If it fires first, the flow leaving it</text>
  <text x="480" y="124" class="cap">is taken instead — no waiting</text>
  <text x="480" y="144" class="cap">forever on somebody who</text>
  <text x="480" y="164" class="cap">has stopped reading their mail.</text>

</svg>
