<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" width="720" height="200" role="img">
  <style>
    .lbl { font: 13px -apple-system, "Segoe UI", Roboto, sans-serif; fill: #202124; }
    .lbl-sm { font: 11px -apple-system, "Segoe UI", Roboto, sans-serif; fill: #3c4043; }
    .lbl-b { font: 600 13px -apple-system, "Segoe UI", Roboto, sans-serif; fill: #202124; }
    .cap { font: italic 12px -apple-system, "Segoe UI", Roboto, sans-serif; fill: #5f6368; }
    .task { fill: #e8f0fe; stroke: #1a73e8; stroke-width: 2; }
    .svc  { fill: #e6f4ea; stroke: #188038; stroke-width: 2; }
    .gw   { fill: #fef7e0; stroke: #ea8600; stroke-width: 2; }
    .ev-s { fill: #e6f4ea; stroke: #188038; stroke-width: 2; }
    .ev-e { fill: #fce8e6; stroke: #c5221f; stroke-width: 3; }
    .ev-i { fill: #fef7e0; stroke: #ea8600; stroke-width: 2; }
    .flow { stroke: #5f6368; stroke-width: 1.6; fill: none; marker-end: url(#a); }
    .tok  { fill: #d93025; stroke: #fff; stroke-width: 2; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5f6368"/>
    </marker>
  </defs>

  <circle cx="80" cy="60" r="22" class="ev-s"/>
  <text x="80" y="108" class="lbl-b" text-anchor="middle">Event</text>
  <text x="80" y="128" class="lbl-sm" text-anchor="middle">something happens</text>
  <text x="80" y="146" class="lbl-sm" text-anchor="middle">a circle</text>

  <rect x="220" y="34" width="120" height="52" rx="10" class="task"/>
  <text x="280" y="108" class="lbl-b" text-anchor="middle">Activity</text>
  <text x="280" y="128" class="lbl-sm" text-anchor="middle">something is done</text>
  <text x="280" y="146" class="lbl-sm" text-anchor="middle">a rounded box</text>

  <path d="M 470 60 L 500 30 L 530 60 L 500 90 Z" class="gw"/>
  <text x="500" y="108" class="lbl-b" text-anchor="middle">Gateway</text>
  <text x="500" y="128" class="lbl-sm" text-anchor="middle">the path splits or joins</text>
  <text x="500" y="146" class="lbl-sm" text-anchor="middle">a diamond</text>

  <line x1="620" y1="60" x2="690" y2="60" class="flow"/>
  <text x="655" y="108" class="lbl-b" text-anchor="middle">Sequence flow</text>
  <text x="655" y="128" class="lbl-sm" text-anchor="middle">what happens next</text>
  <text x="655" y="146" class="lbl-sm" text-anchor="middle">an arrow</text>

</svg>
