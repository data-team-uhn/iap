<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 742" width="820" height="742" role="img">
  <style>
    .lbl { font: 13px -apple-system, "Segoe UI", Roboto, sans-serif; fill: #202124; }
    .lbl-sm { font: 11px -apple-system, "Segoe UI", Roboto, sans-serif; fill: #3c4043; }
    .lbl-b { font: 600 13px -apple-system, "Segoe UI", Roboto, sans-serif; fill: #202124; }
    .cap { font: italic 12px -apple-system, "Segoe UI", Roboto, sans-serif; fill: #5f6368; }
    .task { fill: #e8f0fe; stroke: #1a73e8; stroke-width: 2; }
    .svc  { fill: #e6f4ea; stroke: #188038; stroke-width: 2; }
    .gw   { fill: #fef7e0; stroke: #ea8600; stroke-width: 2; }
    .ev-s { fill: #e6f4ea; stroke: #188038; stroke-width: 2; }
    .ev-e { fill: #fce8e6; stroke: #c5221f; stroke-width: 3; }
    .ev-i { fill: #fef7e0; stroke: #ea8600; stroke-width: 2; }
    .flow { stroke: #5f6368; stroke-width: 1.6; fill: none; marker-end: url(#a); }
    .dflt { stroke: #5f6368; stroke-width: 1.6; fill: none; }
    .tok  { fill: #d93025; stroke: #fff; stroke-width: 2; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5f6368"/>
    </marker>
  </defs>

  <text x="20" y="26" class="lbl-b">Exclusive — one path only</text>
  <line x1="20" y1="140" x2="62" y2="140" class="flow"/>
  <path d="M 66 140 L 96 110 L 126 140 L 96 170 Z" class="gw"/>
  <text x="96" y="146" class="lbl-b" text-anchor="middle">×</text>
  <path d="M 96 110 L 96 76 L 244 76" class="flow"/>
  <text x="104" y="68" class="lbl-sm">under 5 days</text>
  <path d="M 96 170 L 96 204 L 244 204" class="flow"/>
  <line x1="89" y1="190" x2="103" y2="182" class="dflt"/>
  <text x="104" y="222" class="lbl-sm">otherwise</text>
  <rect x="250" y="53" width="120" height="46" rx="10" class="task"/>
  <text x="310" y="81" class="lbl" text-anchor="middle">Simple review</text>
  <rect x="250" y="181" width="120" height="46" rx="10" class="task"/>
  <text x="310" y="209" class="lbl" text-anchor="middle">Detailed review</text>
  <text x="20" y="262" class="cap">Exactly one path is taken. The crossed arrow is the</text>
  <text x="20" y="280" class="cap">default flow used when no other condition holds.</text>

  <text x="450" y="26" class="lbl-b">Parallel — every path, at once</text>
  <line x1="450" y1="140" x2="486" y2="140" class="flow"/>
  <path d="M 488 140 L 518 110 L 548 140 L 518 170 Z" class="gw"/>
  <text x="518" y="146" class="lbl-b" text-anchor="middle">+</text>
  <path d="M 518 110 L 518 76 L 600 76" class="flow"/>
  <path d="M 518 170 L 518 204 L 600 204" class="flow"/>
  <rect x="602" y="53" width="96" height="46" rx="10" class="task"/>
  <text x="650" y="81" class="lbl" text-anchor="middle">Finance</text>
  <rect x="602" y="181" width="96" height="46" rx="10" class="task"/>
  <text x="650" y="209" class="lbl" text-anchor="middle">Ethics</text>
  <path d="M 698 76 L 782 76 L 782 106" class="flow"/>
  <path d="M 698 204 L 782 204 L 782 174" class="flow"/>
  <path d="M 752 140 L 782 110 L 812 140 L 782 170 Z" class="gw"/>
  <text x="782" y="146" class="lbl-b" text-anchor="middle">+</text>
  <text x="450" y="262" class="cap">Both start. The second gateway waits for both</text>
  <text x="450" y="280" class="cap">to finish before anything continues.</text>

  <line x1="20" y1="312" x2="800" y2="312" stroke="#dadce0" stroke-width="1"/>

  <text x="20" y="346" class="lbl-b">Inclusive — every path whose condition holds</text>
  <line x1="20" y1="458" x2="62" y2="458" class="flow"/>
  <path d="M 66 458 L 96 428 L 126 458 L 96 488 Z" class="gw"/>
  <circle cx="96" cy="458" r="11" fill="none" stroke="#202124" stroke-width="2"/>
  <path d="M 96 428 L 96 388 L 244 388" class="flow"/>
  <text x="104" y="380" class="lbl-sm">needs a finance review</text>
  <path d="M 126 458 L 244 458" class="flow"/>
  <text x="134" y="452" class="lbl-sm">needs an ethics review</text>
  <path d="M 96 488 L 96 528 L 470 528 L 470 492" class="flow"/>
  <line x1="89" y1="509" x2="103" y2="501" class="dflt"/>
  <text x="104" y="524" class="lbl-sm">otherwise</text>
  <rect x="250" y="366" width="150" height="44" rx="10" class="task"/>
  <text x="325" y="393" class="lbl" text-anchor="middle">Finance review</text>
  <rect x="250" y="436" width="150" height="44" rx="10" class="task"/>
  <text x="325" y="463" class="lbl" text-anchor="middle">Ethics review</text>
  <path d="M 400 388 L 470 388 L 470 424" class="flow"/>
  <path d="M 400 458 L 436 458" class="flow"/>
  <path d="M 440 458 L 470 428 L 500 458 L 470 488 Z" class="gw"/>
  <circle cx="470" cy="458" r="11" fill="none" stroke="#202124" stroke-width="2"/>
  <line x1="500" y1="458" x2="556" y2="458" class="flow"/>
  <rect x="558" y="436" width="140" height="44" rx="10" class="task"/>
  <text x="628" y="463" class="lbl" text-anchor="middle">Approve request</text>
  <text x="20" y="578" class="cap">Both reviews, one of them, or neither — whichever conditions hold.</text>
  <text x="20" y="596" class="cap">The inclusive join waits for exactly the branches that started.</text>

  <line x1="20" y1="622" x2="800" y2="622" stroke="#dadce0" stroke-width="1"/>

  <text x="410" y="656" class="lbl-b" text-anchor="middle">Remember to close what you opened</text>
  <text x="410" y="682" class="cap" text-anchor="middle">Exclusive splits do not need an exclusive join gateway as only one branch can be taken.</text>
  <text x="410" y="706" class="cap" text-anchor="middle">Parallel or inclusive splits need a matching join or later nodes may be processed</text>
  <text x="410" y="724" class="cap" text-anchor="middle">multiple times, once by each followed branch.</text>

</svg>
