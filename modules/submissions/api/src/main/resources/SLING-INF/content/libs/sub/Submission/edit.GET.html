<!--/* Filling a submission in is a view of it, so it is addressed the way every other view in this
     application is - by extension, /Submissions/name.edit - rather than by a query parameter. The
     app served is the same shell as the read-only page beside this; which of the two it shows is
     decided by the client router from the same extension. Serving it from here rather than from
     JavaScript alone is what lets the server have an opinion about the mode later.

     Rendered by re-dispatching this same resource as .html rather than by including the shell
     script directly: a script included by path is resolved against the *current* request, and the
     `edit` extension has no script under iap/Homepage. The extra selector only makes the inner
     request differ from this one, so Sling does not see it as the same request repeating; nothing
     reads it, and the resolver falls back past it to the shell. `edit` is not a known extension
     either, so the content type has to be stated rather than guessed from it. */-->
<sly data-sly-use.contentType="io.uhndata.iap.scripting.ContentTypeSetter">${contentType.html}</sly>
<sly data-sly-resource="${'.html' @selectors='forceInclude'}"/>
