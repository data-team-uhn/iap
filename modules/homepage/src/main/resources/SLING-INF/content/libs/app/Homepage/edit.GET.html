<!--/* A page in its editing mode, such as /admin/workflows/Workflows/review/v1.edit. It serves the
     same page shell as .html, and the page reads the mode from the extension.

     The resource is dispatched again as .html, rather than the shell script included by path. A
     script included by path is resolved against this request, and nothing serves its `edit`
     extension. The `forceInclude` selector only keeps Sling from taking the inner request for this
     one repeating. Sling cannot tell a content type from `edit`, so the first line states it. */-->
<sly data-sly-resource="${'.html' @selectors='forceInclude'}"/>
