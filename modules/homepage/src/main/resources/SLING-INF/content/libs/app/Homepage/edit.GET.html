<!--/* Editing something is a view of it, addressed the way every other view in this application is:
     by extension, e.g. /admin/workflows/Workflows/review/v1.edit, serving the same shell as the
     default "view" mode.

     Rendered by re-dispatching this same resource as .html rather than by including the shell script
     directly: a script included by path is resolved against the *current* request, which has no
     script for the `edit` extension. The extra selector only makes the inner request differ from
     this one, so Sling does not see it as the same request repeating. `edit` is not a known
     extension either, so the content type has to be stated rather than guessed from it. */-->
<sly data-sly-resource="${'.html' @selectors='forceInclude'}"/>
