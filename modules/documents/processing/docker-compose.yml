# Run the Docling processing daemon with a shared /shared-docs volume.
#
# The caller must mount the same host directory (or set IAP_SHARED_DOCS to match) so it can
# stage uploads and the daemon can write {stem}.md + Chunks/ beside them. The daemon is
# path-based: it only parses files that are already on the shared volume.
#
#   POST http://localhost:18765/parse?path=/shared-docs/<dir>/<file>.pdf
#
# On Linux the daemon has to run as whoever owns the host directory behind /shared-docs, or
# it cannot write {stem}.md and Chunks/ back. Set IAP_DOCLING_UID / IAP_DOCLING_GID to that
# owner ("id -u" / "id -g", usually 1000, which is the default here). The image's own chown
# only stamps the image layer; a bind mount arrives with the host's ownership on top of it.
# Docker Desktop virtualises this, so the value does not matter on Windows or macOS.
#
# See processing.md for the full flow.

services:
  docling:
    build:
      context: .
      dockerfile: Dockerfile
    image: iap/docling:latest
    user: "${IAP_DOCLING_UID:-1000}:${IAP_DOCLING_GID:-1000}"
    environment:
      IAP_SHARED_DOCS: /shared-docs
      # An overridden uid has no passwd entry, so HOME would be unset. Point it somewhere
      # writable for any library that still wants a home directory. LibreOffice does not
      # need it (libreoffice_convert passes its own -env:UserInstallation temp profile).
      HOME: /tmp
    volumes:
      - ${IAP_SHARED_DOCS_HOST:-../shared-docs}:/shared-docs
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 8G
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:18765/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 180s
    restart: unless-stopped
    ports:
      - 127.0.0.1:18765:18765
