# Run the Docling processing daemon with a shared /shared-docs volume.
#
# The caller must mount the same host directory (or set IAP_SHARED_DOCS to match) so it can
# stage uploads and the daemon can write {stem}.md + Chunks/ beside them. The daemon is
# path-based: it only parses files that are already on the shared volume.
#
#   POST http://localhost:18765/parse?path=/shared-docs/<dir>/<file>.pdf
#
# See PARSING_PIPELINE.md for the full flow.

services:
  docling:
    build:
      context: .
      dockerfile: Dockerfile
    image: iap/docling:latest
    user: docling
    environment:
      IAP_SHARED_DOCS: /shared-docs
    volumes:
      - ${IAP_SHARED_DOCS_HOST:-../shared-docs}:/shared-docs
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 8G
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:18765/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 180s
    restart: unless-stopped
    ports:
      - 127.0.0.1:18765:18765
