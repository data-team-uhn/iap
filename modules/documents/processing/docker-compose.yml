# Run the Docling processing daemon with a shared /shared-docs volume.
#
# The main IAP app must mount the same host directory at the same path (or configure
# iap.parse.output.dir / IAP_SHARED_DOCS to match) so Java can stage uploads and the
# daemon can write {stem}.md + Chunks/ beside them.
#
# On the JVM side:
#   -Diap.docling.daemon.url=http://docling:18765
#   -Diap.docling.daemon.autostart=true   # also launch a local daemon
#   -Diap.docling.parse.combined=true
#   -Diap.docling.parse.output.dir=/shared-docs

services:
  docling:
    build:
      context: .
      dockerfile: Dockerfile
    image: iap/docling:latest
    environment:
      IAP_SHARED_DOCS: /shared-docs
    volumes:
      - ${IAP_SHARED_DOCS_HOST:-../shared-docs}:/shared-docs
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 8G
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:18765/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 180s
    restart: unless-stopped
