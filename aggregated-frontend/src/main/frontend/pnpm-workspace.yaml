# Version pins forced onto transitive dependencies. This is the only place pnpm still reads them
# from: the "pnpm" field in package.json is ignored from pnpm 11 on, silently for 11 and with a
# warning for 12. Declaring them there instead does not merely fail to apply the pins — any newer
# pnpm regenerates pnpm-lock.yaml without them, and the pinned pnpm the build uses then refuses the
# lockfile as inconsistent with its configuration.
overrides:
  '@babel/runtime': ^7.29.7
  react-is: ^19.2.0
